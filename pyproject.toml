[project]
name = "kiwi"
version = "1.0"
description = "Hybrid AI–NWP Multi-Model Forecast Blending System (SIH 26081) — DEMO / SYNTHETIC DATA"
requires-python = ">=3.10"
dependencies = [
  "pandas", "numpy", "scipy", "scikit-learn", "fastapi", "uvicorn",
  "pydantic", "pyyaml", "joblib", "pyarrow",
]

[project.optional-dependencies]
# Streamlit dashboard runs locally / deploys separately, not on Vercel.
dashboard = ["streamlit", "plotly", "requests"]
# Test/development-only tools.
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
